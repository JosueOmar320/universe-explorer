# Keeps dependencies current through pull requests, which go through the full CI pipeline
# (tests, end-to-end, Lighthouse) before anything is merged.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # One pull request for every minor/patch update; majors arrive one by one, since they're
    # the ones that need reading the changelog.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    ignore:
      # Node's types must match the Node that runs the project (.nvmrc): newer ones would
      # accept APIs that don't exist at runtime. Bump this together with .nvmrc.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # msw 3 is ready on the chore/msw-3 branch, on hold: Vitest 5 still declares msw ^2, and
      # msw 3.0.2's Node interceptor leaks listeners on reused TLS sockets.
      - dependency-name: msw
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
