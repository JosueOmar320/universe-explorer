# Validates every push to main and every pull request, then deploys main to GitHub Pages.
#
#   validate: npm ci → lint → format → type-check → tests → build ─┐
#   e2e:      npm ci → Playwright + axe (mocked APIs)              ─┴→ deploy (main only)
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; the deploy job asks for what it needs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel outdated pull request runs, but never interrupt a deployment from main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Lint, type-check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # GitHub Pages serves the site under /<repo>/. Every build uses it, so the build
      # validated in a pull request is the same one that gets deployed.
      BASE_PATH: /${{ github.event.repository.name }}/

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The github formatter turns lint errors into inline annotations on the PR diff.
      - name: Lint
        run: npm run lint -- --format github

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      # Vitest adds GitHub annotations for failing tests automatically on Actions.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The build already includes the static-hosting entry points (404.html fallback and
      # one index.html per universe, see build/spaEntryPoints.ts). `push` only fires for
      # main (see `on`), so the artifact is only uploaded for deployments.
      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  e2e:
    name: End-to-end and accessibility tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Playwright advises against caching browsers: restoring them takes about as long.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Builds the app in `mock` mode (APIs served from fixtures) and runs every flow on a
      # desktop and a mobile viewport. Failures show up as annotations on the PR.
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: [validate, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # publish the site
      id-token: write # prove the deployment comes from this workflow (OIDC)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
