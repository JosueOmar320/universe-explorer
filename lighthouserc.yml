# Lighthouse CI: audits the production build (with the real APIs) and fails the pipeline when
# a score or budget regresses. Run locally with `npm run build && npm run lighthouse`.
ci:
  collect:
    staticDistDir: ./dist
    # Every entry point that exists as a file on GitHub Pages (see build/spaEntryPoints.ts).
    url:
      - http://localhost/
      - http://localhost/rick-and-morty/
      - http://localhost/pokemon/
      - http://localhost/star-wars/
      - http://localhost/harry-potter/
    # Three runs per page; assertions use the best one, so a single slow API answer or noisy
    # runner doesn't fail the build. Lighthouse's defaults apply: mobile emulation and
    # simulated slow 4G, the strictest setting.
    numberOfRuns: 3

  assert:
    assertions:
      categories:accessibility: [error, { minScore: 1 }]
      categories:best-practices: [error, { minScore: 1 }]
      categories:seo: [error, { minScore: 1 }]
      # Locally: home 98, universes 94-95. GitHub's shared runners score the same build ~6 points
      # lower and vary between runs (one page's LCP went from 2.6 to 3.4 s), so 0.9 failed builds
      # that hadn't regressed. 0.85 catches real regressions; the byte, CLS and TBT limits below
      # are steadier guards.
      categories:performance: [error, { minScore: 0.85 }]
      cumulative-layout-shift: [error, { maxNumericValue: 0.1 }]
      total-blocking-time: [error, { maxNumericValue: 300 }]
      # The 2.5 s "good" mark. Today: home 2.1 s, universes 2.55-2.75 s (simulated slow 4G):
      # a warning, not an error, since the universes render client-side.
      largest-contentful-paint: [warn, { maxNumericValue: 2500 }]
      # Budgets (compressed bytes) for what the app ships; images and API responses depend on
      # the data. Today: JS ≤ 146 kB, CSS ≤ 12 kB, fonts ≤ 69 kB per page.
      resource-summary:script:size: [error, { maxNumericValue: 174080 }] # 170 kB
      resource-summary:stylesheet:size: [error, { maxNumericValue: 20480 }] # 20 kB
      resource-summary:font:size: [error, { maxNumericValue: 92160 }] # 90 kB

  upload:
    target: filesystem
    outputDir: .lighthouseci/reports
