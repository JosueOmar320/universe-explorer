<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Brand mark (see OrbitMarkIcon): a planet with an orbit, in the hub palette (tokens.css) -->
  <rect width="32" height="32" rx="7" fill="#0d0e11" />
  <g transform="rotate(-25 16 16)" fill="none" stroke-linecap="round">
    <!-- Back half of the orbit, hidden behind the planet -->
    <path d="M3 16a13 4 0 0 1 26 0" stroke="#f1eee8" stroke-width="2" />
    <circle cx="16" cy="16" r="7" fill="#ff6a3d" />
    <!-- Front half, cut out of the planet so it still reads at 16px -->
    <path d="M3 16a13 4 0 0 0 26 0" stroke="#0d0e11" stroke-width="3.5" />
    <path d="M3 16a13 4 0 0 0 26 0" stroke="#f1eee8" stroke-width="2" />
  </g>
</svg>
